<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal Proktor CBT</title>
       
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; -webkit-font-smoothing: antialiased; }
        .modal-overlay { background-color: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // KREDENSIAL SUPABASE (Sama dengan Aplikasi Admin)
        const SUPABASE_URL = 'https://ghxxxiracbwatvasdeel.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_2GqdLnhWp13aVBoR7u6xqg_R5pnH3_g';
        let supabase = null;

        const getSupabase = async () => {
            if (supabase) return supabase;
            if (window.supabase) {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                return supabase;
            }
            let retries = 25;
            while (!window.supabase && retries > 0) {
                await new Promise(resolve => setTimeout(resolve, 100));
                retries--;
            }
            if (window.supabase) {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                return supabase;
            }
            const cdnList = [
                'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js',
                'https://cdnjs.cloudflare.com/ajax/libs/supabase/2.39.3/supabase.umd.min.js',
                'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js'
            ];
            for (const cdnUrl of cdnList) {
                try {
                    await new Promise((resolve, reject) => {
                        const script = document.createElement('script');
                        script.src = cdnUrl;
                        script.crossOrigin = 'anonymous';
                        script.onload = () => {
                            if (window.supabase) resolve();
                            else reject(new Error("Dimuat tapi window.supabase kosong."));
                        };
                        script.onerror = () => reject(new Error(`Gagal memuat ${cdnUrl}`));
                        document.head.appendChild(script);
                    });
                    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    return supabase;
                } catch (e) {
                    console.warn(`Fallback CDN Gagal: ${e.message}. Mencoba jalur lain...`);
                }
            }
            throw new Error("Semua jalur CDN diblokir oleh jaringan atau browser Anda. Gunakan Live Server atau ganti koneksi internet.");
        };

        // KOMPONEN MODAL KUSTOM (Pengganti Alert & Prompt)
        const CustomModal = ({ isOpen, title, message, type = 'info', onConfirm, onCancel, confirmText = 'OK', cancelText = 'Batal', isPrompt = false, promptType = 'text', promptOptions = [], promptValue, setPromptValue }) => {
            if (!isOpen) return null;
            
            const isDanger = type === 'danger';
            const icon = isDanger ? <i className="fas fa-exclamation-triangle text-rose-500 text-3xl"></i> : 
                         (isPrompt ? <i className="fas fa-edit text-blue-500 text-3xl"></i> : <i className="fas fa-info-circle text-blue-500 text-3xl"></i>);
            
            return (
                <div className="fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 transform transition-all animate-fadeIn">
                        <div className="flex flex-col items-center text-center">
                            <div className={`w-16 h-16 rounded-full flex items-center justify-center mb-4 ${isDanger ? 'bg-rose-100' : 'bg-blue-100'}`}>
                                {icon}
                            </div>
                            <h3 className="text-xl font-bold text-slate-800 mb-2">{title}</h3>
                            <p className="text-slate-600 text-sm mb-6">{message}</p>
                            
                            {isPrompt && promptType === 'text' && (
                                <input 
                                    type="text" 
                                    value={promptValue} 
                                    onChange={(e) => setPromptValue(e.target.value)}
                                    className="w-full border-2 border-slate-200 rounded-xl p-3 mb-6 font-mono font-bold text-center focus:border-blue-500 outline-none uppercase"
                                    placeholder="Ketik nilai baru..."
                                />
                            )}
                            
                            {isPrompt && promptType === 'select' && (
                                <select 
                                    value={promptValue} 
                                    onChange={(e) => setPromptValue(e.target.value)}
                                    className="w-full border-2 border-slate-200 rounded-xl p-3 mb-6 font-bold text-center focus:border-blue-500 outline-none cursor-pointer"
                                >
                                    {promptOptions.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
                                </select>
                            )}
                            
                            <div className="flex w-full gap-3">
                                {onCancel && (
                                    <button onClick={onCancel} className="flex-1 py-2.5 rounded-xl font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 transition-colors">
                                        {cancelText}
                                    </button>
                                )}
                                <button onClick={onConfirm} className={`flex-1 py-2.5 rounded-xl font-bold text-white transition-colors shadow-md ${isDanger ? 'bg-rose-600 hover:bg-rose-700' : 'bg-blue-600 hover:bg-blue-700'}`}>
                                    {confirmText}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            const [currentRoute, setCurrentRoute] = useState('/login');
            const [isLoading, setIsLoading] = useState(false);
            
            // State Data Database
            const [schools, setSchools] = useState([]);
            const [tokens, setTokens] = useState([]);
            const [results, setResults] = useState([]);
            const [questions, setQuestions] = useState([]);
            const [sysFolders, setSysFolders] = useState([]); // State untuk Mapel dari tabel Token
            const [activeFolder, setActiveFolder] = useState('Utama'); // Tambahkan baris ini
            
            // State Sesi Proktor
            const [loggedSchool, setLoggedSchool] = useState(null);
            
            // State Modal Alert
            const [modal, setModal] = useState({ isOpen: false });

            const showMsg = (title, message, type = 'info') => {
                setModal({ isOpen: true, title, message, type, onConfirm: () => setModal({ isOpen: false }) });
            };

            // 1. Fetch Daftar Sekolah untuk Dropdown Login
            useEffect(() => {
                const fetchSchools = async () => {
                    try {
                        const db = await getSupabase();
                        // Ambil semua token peserta untuk mendapatkan daftar nama sekolah unik
                        const { data, error } = await db.from('tokens').select('participant_school').not('code', 'ilike', 'SYS_%');
                        if (error) throw error;
                        
                        if (data) {
                            const uniqueSchools = [...new Set(data.map(d => d.participant_school).filter(Boolean))];
                            setSchools(uniqueSchools.sort());
                        }
                    } catch (err) {
                        console.error("Gagal memuat daftar sekolah:", err);
                    }
                };
                // Langsung dipanggil, karena fungsi getSupabase() sudah memiliki penunda otomatis (await)
                fetchSchools(); 
            }, []);

            // 2. Fetch Data Utama Setelah Login
            const fetchDataProktor = async (schoolName) => {
                setIsLoading(true);
                try {
                    const db = await getSupabase();
                    
                    const fetchAllData = async (tableName, matchCol, matchVal) => {
                        let allData = [];
                        let from = 0; const step = 999; let hasMore = true;
                        while (hasMore) {
                            let query = db.from(tableName).select('*');
                            if (matchCol) query = query.eq(matchCol, matchVal);
                            const { data, error } = await query.range(from, from + step);
                            if (error) throw error;
                            if (data && data.length > 0) { allData = [...allData, ...data]; from += (step + 1); }
                            if (!data || data.length <= step) hasMore = false;
                        }
                        return allData;
                    };

                    const [tRes, rRes, qRes, fRes, actFoldRes] = await Promise.all([
                        fetchAllData('tokens', 'participant_school', schoolName),
                        fetchAllData('results', 'participant_school', schoolName),
                        fetchAllData('questions'),
                        db.from('tokens').select('status').like('code', 'SYS_FOLDER_%'), // Tarik Mapel dari Supabase
                        db.from('tokens').select('status').eq('code', 'SYS_SETTING_FOLDER').maybeSingle() // Tarik pengaturan folder aktif
                    ]);
                    
                    // PERBAIKAN: Format data results agar detailed_results di-parse dari string menjadi JSON (Objek)
                    const formattedResults = rRes.map(r => ({
                        id: r.id,
                        participant_name: r.participant_name,
                        participant_school: r.participant_school,
                        token: r.token,
                        score: r.score,
                        detail: { detailedResults: typeof r.detailed_results === 'string' ? JSON.parse(r.detailed_results) : r.detailed_results }
                    }));
                    
                    setTokens(tRes);
                    setResults(formattedResults); // Simpan hasil yang sudah di-parse
                    setQuestions(qRes);
                    if (fRes.data) setSysFolders(fRes.data.map(f => f.status));
                    if (actFoldRes.data) setActiveFolder(actFoldRes.data.status); // Set Folder Aktif
                    
                } catch (error) {
                    showMsg("Gagal Sinkronisasi", error.message, 'danger');
                } finally {
                    setIsLoading(false);
                }
            };

            const handleLogout = () => {
                setLoggedSchool(null);
                setCurrentRoute('/login');
            };

            const navigate = (path) => {
                setCurrentRoute(path);
                window.scrollTo(0, 0);
            };

            // VIEW: LOGIN
            const LoginView = () => {
                const [selectedSchool, setSelectedSchool] = useState('');
                const [npsn, setNpsn] = useState('');

                const doLogin = (e) => {
                    e.preventDefault();
                    if (!selectedSchool) return showMsg("Peringatan", "Silakan pilih nama sekolah Anda terlebih dahulu.", "danger");
                    
                    // MOCKUP VALIDASI NPSN (Password Default: 123456)
                    if (npsn === '123456' || npsn.toLowerCase() === 'npsn') {
                        setLoggedSchool(selectedSchool);
                        fetchDataProktor(selectedSchool);
                        navigate('/peserta');
                    } else {
                        showMsg("Login Gagal", "Password NPSN salah. (Gunakan '123456' untuk keperluan ujicoba)", "danger");
                    }
                };

                return (
                    <div className="min-h-screen bg-slate-100 flex flex-col justify-center items-center p-4">
                        <div className="max-w-md w-full bg-white rounded-3xl shadow-xl overflow-hidden">
                            <div className="bg-blue-600 p-8 text-center">
                                <div className="w-16 h-16 bg-white/20 text-white rounded-2xl flex items-center justify-center mx-auto mb-4 backdrop-blur-sm">
                                    <i className="fas fa-shield-alt text-3xl"></i>
                                </div>
                                <h1 className="text-2xl font-bold text-white">Login Proktor</h1>
                                <p className="text-blue-100 text-sm mt-1">Portal Pengawas Ujian Sekolah</p>
                            </div>
                            <div className="p-8">
                                <form onSubmit={doLogin} className="space-y-5">
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-2">Asal Sekolah</label>
                                        <select 
                                            value={selectedSchool} 
                                            onChange={(e) => setSelectedSchool(e.target.value)}
                                            className="w-full p-3.5 border-2 border-slate-200 rounded-xl bg-slate-50 focus:bg-white focus:border-blue-500 font-semibold outline-none transition-colors cursor-pointer"
                                        >
                                            <option value="">-- Pilih Sekolah Anda --</option>
                                            {schools.map(s => <option key={s} value={s}>{s}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-2">Password (NPSN)</label>
                                        <input 
                                            type="password" 
                                            value={npsn} 
                                            onChange={(e) => setNpsn(e.target.value)}
                                            className="w-full p-3.5 border-2 border-slate-200 rounded-xl bg-slate-50 focus:bg-white focus:border-blue-500 font-bold outline-none transition-colors"
                                            placeholder="Masukkan NPSN..."
                                            required
                                        />
                                        <p className="text-xs text-slate-400 mt-2 italic">*Ketik 123456 untuk simulasi</p>
                                    </div>
                                    <button type="submit" className="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-600/30 transition-all transform hover:-translate-y-0.5">
                                        Masuk ke Dashboard
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                );
            };

            // LAYOUT PROKTOR
            const ProktorLayout = ({ children, title }) => (
                <div className="min-h-screen bg-slate-50 flex flex-col md:flex-row">
                    {/* Sidebar */}
                    <div className="w-full md:w-64 bg-slate-900 text-white flex flex-col shrink-0">
                        <div className="p-6 border-b border-slate-800">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-blue-500 rounded-lg flex items-center justify-center">
                                    <i className="fas fa-user-shield text-xl"></i>
                                </div>
                                <div>
                                    <h2 className="font-bold text-sm">PROKTOR</h2>
                                    <p className="text-xs text-blue-300 font-semibold truncate w-36" title={loggedSchool}>{loggedSchool}</p>
                                </div>
                            </div>
                        </div>
                        <nav className="flex-1 p-4 space-y-2">
                            <button onClick={() => navigate('/peserta')} className={`w-full flex items-center px-4 py-3 rounded-xl text-sm font-semibold transition-colors ${currentRoute === '/peserta' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                                <i className="fas fa-users w-6"></i> Data Peserta
                            </button>
                            <button onClick={() => navigate('/hasil')} className={`w-full flex items-center px-4 py-3 rounded-xl text-sm font-semibold transition-colors ${currentRoute === '/hasil' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                                <i className="fas fa-chart-bar w-6"></i> Pantauan Hasil
                            </button>
                        </nav>
                        <div className="p-4 border-t border-slate-800">
                            <button onClick={handleLogout} className="w-full flex items-center justify-center px-4 py-3 rounded-xl text-sm font-semibold text-rose-400 hover:bg-rose-500 hover:text-white transition-colors">
                                <i className="fas fa-sign-out-alt mr-2"></i> Keluar
                            </button>
                        </div>
                    </div>
                    
                    {/* Konten Utama */}
                    <div className="flex-1 flex flex-col h-screen overflow-hidden">
                        <header className="bg-white border-b px-8 py-5 flex justify-between items-center shrink-0">
                            <h2 className="text-xl font-bold text-slate-800">{title}</h2>
                            <button onClick={() => fetchDataProktor(loggedSchool)} className="text-blue-600 bg-blue-50 hover:bg-blue-100 p-2.5 rounded-lg transition-colors" title="Refresh Data">
                                <i className={`fas fa-sync-alt ${isLoading ? 'fa-spin' : ''}`}></i>
                            </button>
                        </header>
                        <main className="flex-1 overflow-y-auto p-4 md:p-8">
                            {isLoading ? (
                                <div className="h-full flex flex-col items-center justify-center text-slate-400">
                                    <i className="fas fa-spinner fa-spin text-4xl mb-4"></i>
                                    <p className="font-semibold">Memuat Data Sekolah...</p>
                                </div>
                            ) : children}
                        </main>
                    </div>
                </div>
            );

            // VIEW: DATA PESERTA (Bisa Edit Status)
            const PesertaView = () => {
                const [search, setSearch] = useState('');
                const [sortOrder, setSortOrder] = useState('DEFAULT');
                const [editPrompt, setEditPrompt] = useState({ isOpen: false, tokenObj: null, newValue: '' });

                let filteredTokens = tokens.filter(t => 
                    t.participant_name.toLowerCase().includes(search.toLowerCase()) || 
                    t.code.toLowerCase().includes(search.toLowerCase())
                );
                
                if (sortOrder === 'NAME_ASC') {
                    filteredTokens.sort((a, b) => a.participant_name.localeCompare(b.participant_name));
                } else if (sortOrder === 'NAME_DESC') {
                    filteredTokens.sort((a, b) => b.participant_name.localeCompare(a.participant_name));
                }

                const openEditStatus = (tokenObj) => {
                    setEditPrompt({ isOpen: true, tokenObj, newValue: tokenObj.status });
                };

                const saveNewStatus = async () => {
                    const newStatus = editPrompt.newValue;
                    if (!newStatus || newStatus === editPrompt.tokenObj.status) {
                        setEditPrompt({ isOpen: false, tokenObj: null, newValue: '' });
                        return;
                    }
                    
                    setIsLoading(true);
                    setEditPrompt({ isOpen: false, tokenObj: null, newValue: '' });
                    try {
                        const db = await getSupabase();
                        // Update di tabel tokens
                        const { error } = await db.from('tokens')
                            .update({ status: newStatus })
                            .eq('code', editPrompt.tokenObj.code);
                        
                        if (error) throw error;
                        
                        showMsg("Berhasil", `Status berhasil diubah menjadi ${newStatus}`, "info");
                        fetchDataProktor(loggedSchool); // Refresh data
                    } catch (err) {
                        showMsg("Gagal Edit", err.message, "danger");
                        setIsLoading(false);
                    }
                };

                return (
                    <ProktorLayout title="Manajemen Data Peserta">
                        <div className="bg-white rounded-2xl border shadow-sm flex flex-col h-full overflow-hidden">
                            <div className="p-5 border-b bg-slate-50 flex flex-wrap justify-between items-center gap-4">
                                <div className="flex flex-1 gap-2 min-w-[300px]">
                                    <div className="relative w-full max-w-sm">
                                        <i className="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                                        <input 
                                            type="text" 
                                            placeholder="Cari nama atau token siswa..."
                                            value={search}
                                            onChange={(e) => setSearch(e.target.value)}
                                            className="w-full pl-10 pr-4 py-2 border rounded-lg outline-none focus:border-blue-500 font-medium text-sm"
                                        />
                                    </div>
                                    <select 
                                        value={sortOrder} 
                                        onChange={(e) => setSortOrder(e.target.value)}
                                        className="p-2 border rounded-lg outline-none focus:border-blue-500 font-medium text-sm bg-white cursor-pointer"
                                    >
                                        <option value="DEFAULT">Urutan Acak</option>
                                        <option value="NAME_ASC">Nama A-Z</option>
                                        <option value="NAME_DESC">Nama Z-A</option>
                                    </select>
                                </div>
                                <div className="text-sm font-bold text-slate-500 hidden sm:block">
                                    Total: {filteredTokens.length} Siswa
                                </div>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm whitespace-nowrap">
                                    <thead className="bg-white border-b">
                                        <tr>
                                            <th className="p-4 font-bold text-slate-600 text-center w-12">No</th>
                                            <th className="p-4 font-bold text-slate-600">Nama Peserta</th>
                                            <th className="p-4 font-bold text-slate-600">Token Akses</th>
                                            <th className="p-4 font-bold text-slate-600 text-center">Status</th>
                                            <th className="p-4 font-bold text-slate-600 text-center">Aksi</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {filteredTokens.map((t, i) => (
                                            <tr key={t.code} className="border-b hover:bg-slate-50 transition-colors">
                                                <td className="p-4 text-center font-semibold text-slate-400">{i+1}</td>
                                                <td className="p-4 font-bold text-slate-800 uppercase">{t.participant_name}</td>
                                                <td className="p-4 font-mono font-bold text-blue-600 tracking-wider bg-blue-50/30">{t.code}</td>
                                                <td className="p-4 text-center">
                                                    <span className={`px-2.5 py-1 text-[10px] font-bold rounded uppercase tracking-wider ${t.status === 'AVAILABLE' ? 'bg-emerald-50 text-emerald-600 border border-emerald-100' : (t.status === 'USED' ? 'bg-amber-50 text-amber-600 border border-amber-100' : 'bg-rose-50 text-rose-600 border border-rose-100')}`}>
                                                        {t.status}
                                                    </span>
                                                </td>
                                                <td className="p-4 text-center">
                                                    <button onClick={() => openEditStatus(t)} className="px-4 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-bold transition-colors border shadow-sm">
                                                        <i className="fas fa-edit mr-1.5"></i> Edit Status
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                        {filteredTokens.length === 0 && (
                                            <tr>
                                                <td colSpan="5" className="p-8 text-center font-bold text-slate-400 italic">Tidak ada siswa ditemukan.</td>
                                            </tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        {/* Modal Prompt Edit Status */}
                        <CustomModal 
                            isOpen={editPrompt.isOpen}
                            title="Edit Status Peserta"
                            message={`Ubah status ujian untuk ${editPrompt.tokenObj?.participant_name}.`}
                            isPrompt={true}
                            promptType="select"
                            promptOptions={[
                                { value: 'AVAILABLE', label: 'AVAILABLE' },
                                { value: 'USED', label: 'USED' },
                                { value: 'EXPIRED', label: 'EXPIRED' }
                            ]}
                            promptValue={editPrompt.newValue}
                            setPromptValue={(val) => setEditPrompt({...editPrompt, newValue: val})}
                            confirmText="Simpan"
                            onConfirm={saveNewStatus}
                            onCancel={() => setEditPrompt({ isOpen: false, tokenObj: null, newValue: '' })}
                        />
                    </ProktorLayout>
                );
            };

            // VIEW: HASIL UJIAN (Pantauan Status)
            const HasilView = () => {
                const [search, setSearch] = useState('');
                const [filterMapel, setFilterMapel] = useState('Semua');
                const [sortOrder, setSortOrder] = useState('DEFAULT');

                // FUNGSI PENCARI NAMA FOLDER DARI RESULT
                const getResultFolder = (r) => {
                    const firstQId = r.detail?.detailedResults?.find(x => x.qId !== 'SYS_CHEATS')?.qId;
                    if (!firstQId) return activeFolder || '-';
                    const q = questions.find(x => x.id === firstQId);
                    return q ? (q.folder || activeFolder || '-') : (activeFolder || '-');
                };

                // Susun status untuk setiap siswa (Gabungkan data Tokens dan Results)
                const monitoringData = tokens.filter(t => !t.code.startsWith('SYS_') && !t.code.startsWith('SEC_')).map(t => {
                    // Cari apakah token ini sudah masuk ke tabel results
                    const resMatch = results.find(r => r.token === t.code || r.participant_name === t.participant_name);
                    
                    let statusLabel = '';
                    let statusColor = '';
                    
                    if (resMatch) {
                        statusLabel = 'SELESAI';
                        statusColor = 'bg-emerald-100 text-emerald-700 border-emerald-200';
                    } else if (t.status === 'USED') {
                        statusLabel = 'BELUM SELESAI';
                        statusColor = 'bg-rose-100 text-rose-700 border-rose-200';
                    } else {
                        statusLabel = 'BELUM UJIAN';
                        statusColor = 'bg-slate-100 text-slate-500 border-slate-200';
                    }

                    return {
                        id: resMatch ? resMatch.id : t.code,
                        name: t.participant_name,
                        school: t.participant_school || loggedSchool,
                        token: t.code,
                        status: statusLabel,
                        color: statusColor,
                        folder: resMatch ? getResultFolder(resMatch) : (activeFolder || 'Utama')
                    };
                });

                // Gabungkan Mapel dari SYS_FOLDER (Supabase), Tabel Questions, dan folder dari results
                const mapels = ['Semua', ...new Set([
                    ...sysFolders, 
                    ...questions.map(q => q.folder || 'Utama'), 
                    ...monitoringData.map(m => m.folder).filter(f => f !== '-')
                ])];

                const filteredMonitor = monitoringData.filter(m => 
                    (filterMapel === 'Semua' || m.folder === filterMapel) &&
                    (m.name || '').toLowerCase().includes(search.toLowerCase())
                );

                if (sortOrder === 'NAME_ASC') filteredMonitor.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
                else if (sortOrder === 'NAME_DESC') filteredMonitor.sort((a, b) => (b.name || '').localeCompare(a.name || ''));

                return (
                    <ProktorLayout title="Pantauan Hasil Ujian">
                        <div className="mb-6 flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4 bg-white p-4 rounded-xl border shadow-sm">
                            <div className="flex flex-wrap items-center gap-2 w-full xl:w-auto">
                                <div className="flex flex-wrap items-center gap-2 bg-slate-50 border border-slate-200 p-1.5 rounded-lg w-full sm:w-auto">
                                    <select value={filterMapel} onChange={e=>setFilterMapel(e.target.value)} className="border-none py-1 px-2 text-sm bg-transparent font-semibold outline-none cursor-pointer text-blue-700 max-w-[200px] truncate">
                                        {mapels.map(m => <option key={m} value={m}>{m === 'Semua' ? 'Kategori: Semua' : m}</option>)}
                                    </select>
                                </div>
                                <select value={sortOrder} onChange={e=>setSortOrder(e.target.value)} className="border border-slate-300 rounded-lg p-2 text-sm bg-white font-semibold outline-none cursor-pointer">
                                    <option value="DEFAULT">Urutan Terbaru</option>
                                    <option value="NAME_ASC">Nama A-Z</option>
                                    <option value="NAME_DESC">Nama Z-A</option>
                                </select>
                            </div>
                            <div className="flex gap-2 w-full xl:w-auto">
                                <button onClick={() => fetchDataProktor(loggedSchool)} className="flex-1 sm:flex-none bg-blue-50 text-blue-600 border border-blue-200 px-4 py-2.5 rounded-lg text-sm font-bold flex items-center justify-center hover:bg-blue-100 transition-colors shadow-sm" title="Muat Ulang">
                                    <i className={`fas fa-sync-alt ${isLoading ? 'fa-spin' : ''}`}></i>
                                </button>
                            </div>
                        </div>

                        <div className="bg-white rounded-xl border overflow-x-auto shadow-sm">
                            <table className="w-full text-left text-sm">
                                <thead className="bg-slate-50 border-b">
                                    <tr>
                                        <th className="p-4 w-12 text-center">No</th>
                                        <th className="p-4">Nama Peserta</th>
                                        <th className="p-4">Sekolah/Kelas</th>
                                        <th className="p-4">Tipe Soal</th>
                                        <th className="p-4 text-center">Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredMonitor.map((m, idx) => (
                                        <tr key={m.id} className="border-b transition-colors hover:bg-slate-50">
                                            <td className="p-4 text-center font-semibold text-slate-500">{idx + 1}</td>
                                            <td className="p-4 font-bold text-slate-800 uppercase">{m.name}</td>
                                            <td className="p-4 font-medium text-slate-600">{m.school}</td>
                                            <td className="p-4 font-semibold text-blue-600">{m.folder}</td>
                                            <td className="p-4 text-center">
                                                <span className={`px-2 py-1 text-[10px] font-bold rounded uppercase tracking-wider ${m.color}`}>{m.status}</span>
                                            </td>
                                        </tr>
                                    ))}
                                    {filteredMonitor.length === 0 && (
                                        <tr>
                                            <td colSpan="5" className="text-center p-8 text-slate-500 font-bold bg-slate-50">
                                                Belum ada data hasil ujian yang masuk.
                                            </td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </ProktorLayout>
                );
            };

            return (
                <>
                    {currentRoute === '/login' && <LoginView />}
                    {currentRoute === '/peserta' && <PesertaView />}
                    {currentRoute === '/hasil' && <HasilView />}
                    
                    {/* Render Global Modal Kustom */}
                    <CustomModal 
                        isOpen={modal.isOpen}
                        title={modal.title}
                        message={modal.message}
                        type={modal.type}
                        onConfirm={modal.onConfirm}
                    />
                </>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
